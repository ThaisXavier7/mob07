<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

.hero-img {
    min-height: 380px;
    background-image: url('https://picsum.photos/id/1015/1200/600');
    background-size: cover;
    background-position: center;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px; margin: 20px; overflow: hidden;
}
.overlay {
    background: rgba(0,0,0,0.55);
    color: white; padding: 40px 24px; text-align: center;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.overlay h1 { font-size: 2rem; margin-bottom: 12px; }
.overlay p { font-size: 1rem; opacity: 0.9; margin-bottom: 22px; }
.btn-cta { padding: 12px 28px; background: #a855f7; color: white; border: none; border-radius: 30px; font-weight: 800; cursor: pointer; }


    </style>

</head>
<body>
    

<section class="hero-img">
    <div class="overlay">
        <h1>Descubra novas experiências</h1>
        <p>Os melhores destinos para sua próxima viagem</p>
        <button class="btn-cta">Explorar</button>
    </div>
</section>

</script>
</body>
</html>
